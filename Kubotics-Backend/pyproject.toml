[project]
name = "kubotics-backend"
version = "0.1.0"
description = "Kubotics AI-First Autonomous Platform API & Lead Engine"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.0",
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13.3",
    "httpx>=0.27.2",
    "python-multipart>=0.0.12",
    "msal>=1.39.0",
    "cryptography>=50.0.2",
    "python-telegram-bot>=21.0",
    "groq>=0.11.0",
    "elevenlabs>=1.0.0",
    "openai>=1.50.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py314"
