name: Deploy Kubotics Frontend to AWS S3 & CloudFront

on:
  push:
    branches:
      - main
    paths:
      - 'Kubotics/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

env:
  AWS_REGION: eu-central-1
  S3_BUCKET: kubotics

jobs:
  deploy-frontend:
    name: Build & Sync to S3
    runs-on: ubuntu-24.04
    environment: Kubotics Prod
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Kubotics/package-lock.json

      - name: Install Dependencies
        working-directory: Kubotics
        run: npm ci

      - name: Build Angular Application
        working-directory: Kubotics
        env:
          CI: true
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync Prerendered Static Site to S3
        run: |
          set -euo pipefail
          # Cache discipline (2026-11-10): hashed bundles are immutable, HTML is
          # never cached. index.html has no Cache-Control today, so browsers use
          # HEURISTIC caching and can keep serving an old bundle for days — which
          # is exactly how Vincent's phone stayed on the popup-era login while
          # desktops had the 2026-11-01 Android redirect fix (mobile sign-in
          # opened a new tab with the same Sign-in button and did nothing).
          # Pass 1: everything except HTML, forever. Pass 2: HTML revalidated on
          # every load (either order of the two passes yields the same result,
          # because pass 2 re-creates anything pass 1 may have skipped/deleted).
          aws s3 sync Kubotics/dist/Kubotics/browser/ s3://${{ env.S3_BUCKET }}/ \
            --delete --exclude "*.html" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync Kubotics/dist/Kubotics/browser/ s3://${{ env.S3_BUCKET }}/ \
            --exclude "*" --include "*.html" \
            --cache-control "no-cache, must-revalidate"

      - name: Invalidate CloudFront Distribution Cache
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          DIST_ID="$CLOUDFRONT_DISTRIBUTION_ID"
          if [ -z "$DIST_ID" ]; then
            echo "CLOUDFRONT_DISTRIBUTION_ID secret not provided, looking up distribution for www.kubotics.ch dynamically..."
            DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Aliases.Items && contains(Aliases.Items, 'www.kubotics.ch')].Id | [0]" --output text)
            if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
              DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?DomainName=='d2pfd09n89i3ec.cloudfront.net'].Id | [0]" --output text)
            fi
          fi

          if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
            echo "Invalidating CloudFront cache for distribution $DIST_ID..."
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
          else
            echo "ERROR: Could not determine CloudFront distribution ID for www.kubotics.ch."
            exit 1
          fi
