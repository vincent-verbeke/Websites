name: Deploy Kubotics Frontend to AWS S3 & CloudFront

on:
  push:
    branches:
      - main
    paths:
      - 'Kubotics/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

env:
  AWS_REGION: eu-central-1
  S3_BUCKET: kubotics-web-frontend

jobs:
  deploy-frontend:
    name: Build & Sync to S3
    runs-on: ubuntu-24.04
    environment: Kubotics Prod
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Kubotics/package-lock.json

      - name: Install Dependencies
        working-directory: Kubotics
        run: npm ci

      - name: Build Angular Application
        working-directory: Kubotics
        env:
          CI: true
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync Prerendered Static Site to S3
        run: |
          aws s3 sync Kubotics/dist/Kubotics/browser/ s3://${{ env.S3_BUCKET }}/ --delete

      - name: Invalidate CloudFront Distribution Cache (Optional / If Configured)
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -n "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
            echo "Invalidating CloudFront cache for distribution $CLOUDFRONT_DISTRIBUTION_ID..."
            aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
          else
            echo "CLOUDFRONT_DISTRIBUTION_ID secret not set. Skipping cache invalidation."
          fi
